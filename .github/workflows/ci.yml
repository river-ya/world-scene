name: CPU source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify source locks and publication boundaries
        run: python -B tools/check_public.py
      - name: Standard-library tests (GPU and external-image checks may skip)
        run: python -B -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          for script in slurm/*.sh slurm/lucid/*.sh; do
            bash -n "$script" || exit 1
          done
